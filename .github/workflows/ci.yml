# Gate für PRs nach main (docs/ci-gate-inventar.md, EPIC-P28): schneller Kern —
# lint, typecheck, die check:*-Guards, die schnellen Kern-Tests und der
# PWA-Build. Alles Langsame (Vitest-Dateien über dem Schwellenwert aus
# scripts/slow-tests.json, volle Suite, E2E, K8) läuft auf ci/full-suite
# zweimal täglich im Zeitplan — siehe nightly.yml. Skips und fehlende
# Voraussetzungen sind dort nie grün (Skip-Bericht je Shard + Aggregation).
name: ci

on:
  pull_request:
    branches: [main]

# Minimalrechte für GITHUB_TOKEN — der Workflow liest nur.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Die Tests setzen tmux, ffmpeg, pdftotext und tesseract voraus; ohne sie wäre verify
  # rot statt aussagekräftig. ripgrep und iproute2 sind auf ubuntu-latest vorinstalliert und
  # wurden hier nur mitinstalliert — gemessen kostet das apt-Paket 0:49 im PR-Gate.
  APT_TOOLS: tmux git ffmpeg poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
  # Runner-sensible Tests (BUG-0163: K8-Lastfall; BUG-0168: Fleet-Dedup-Race)
  # sind auf gehosteter Hardware nicht aussagekräftig — sie skippen sichtbar
  # (it.skipIf) und bleiben lokal im Gate verbindlich.
  AV_HOSTED_RUNNER: "1"

jobs:
  verify:
    # PR-Gate: schneller Kern. Die volle Suite (inkl. Slow-Tests >10 s)
    # fährt nightly.yml auf ci/full-suite im Zeitplan oder per Hand.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:commits vergleicht mit origin/main — braucht die volle Historie.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Node-Module aus dem Cache
        id: nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Nur der exakte Lockfile-Treffer gilt als übernommen (cache-hit). Bei einem
          # Teil-Treffer über restore-keys läuft unten trotzdem npm ci — nie ein halber Stand.
          # Der Key nennt OS, Architektur und Node: esbuild ist die einzige plattformabhängige
          # Datei im Baum, und sie wird in jedem Lauf mit `npm rebuild esbuild` neu gesetzt. Das
          # Runner-Bild selbst ist im Key-Ausdruck nicht greifbar (`ImageOS` lebt nur in der
          # Shell) — Maßstab sind Plattform und Node-Stufe.
          # Gesät wird dieser Cache von cache-warm.yml auf main — Caches von PR-Zweigen sieht
          # ein zweiter PR-Zweig nicht (GitHub-Cache-Geltung: eigener Zweig + main).
          path: node_modules
          key: nm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nm-${{ runner.os }}-${{ runner.arch }}-node24-
      - name: "Schneller Kern — apt, Abhängigkeiten, Guards und Tests überlappt"
        # Wanduhr statt Warteschlange (gemessen PR #129, Lauf 44175855458: 5:14; PR #131:
        # 3:41). apt 0:20, npm ci 0:40, Guards 1:02, Build 0:03 und die schnellen Kern-Tests
        # 1:38-2:16 liefen hintereinander. Hier laufen sie überlappt, aber in der einzig
        # zulässigen Reihenfolge: die Tests starten erst, NACHDEM apt durch ist — sonst
        # skippen tmux/ffmpeg/pdftotext-Tests still und der Gate wäre heller, nicht ehrlicher.
        # Gate-INHALT ist unverändert: jeder Guard entscheidet weiterhin einzeln OK oder Fail.
        run: |
          set -u
          mkdir -p test-results
          ( sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $APT_TOOLS > /dev/null ) &
          apt_pid=$!
          if [ "${{ steps.nm.outputs.cache-hit }}" = "true" ]; then
            echo "node_modules aus dem Cache — Lockfile exakt, npm ci entfällt"
          else
            npm ci
          fi
          npm rebuild esbuild
          fehler=0
          for gate in check:workspace-links typecheck lint check:commits check:arch check:knip check:names check:adapter-matrix check:context check:epics check:skills check:i18n check:secrets; do
            echo "::group::$gate"
            npm run -s "$gate" || fehler=1
            echo "::endgroup::"
          done
          wait "$apt_pid" || fehler=1
          npm run test:fast -- --reporter=junit --reporter=default --outputFile=test-results/vitest-junit.xml > test-results/fast-tests.log 2>&1 &
          tests=$!
          echo "::group::pwa-build"
          npm -w @ancientvoid/pwa run build || fehler=1
          echo "::endgroup::"
          echo "::group::check:media"
          npm run -s check:media || fehler=1
          echo "::endgroup::"
          # AC-P1-6: Secret-Scan bleibt wiederholtes Gate (Guard-Liste oben). EPIC-P62 T62.2
          # (AC-P62-5): Medien-Leak-Guard hier zusätzlich mit OCR über neue/geänderte
          # Guide-/Site-Screenshots — dafür ist tesseract inzwischen installiert.
          echo "::group::check:media --ocr"
          npm run -s check:media -- --ocr || fehler=1
          echo "::endgroup::"
          wait "$tests" || fehler=1
          echo "::group::schnelle Kern-Tests (Slow-Liste: scripts/slow-tests.json)"
          cat test-results/fast-tests.log
          echo "::endgroup::"
          [ "$fehler" -eq 0 ]
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-junit
          path: test-results/vitest-junit.xml
          retention-days: 14
          if-no-files-found: warn
